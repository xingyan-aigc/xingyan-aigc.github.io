<main id="top" class="page library-page"><div class="page-heading"><div><p class="eyebrow">IP收纳 / 全部小说</p><h1>全部小说</h1><p class="subtitle">保存原书资料与全部已采内容拆解。分类与读者不限；点击书名查看IP档案。</p></div><p id="assessment-meta" class="update-note"></p></div><section id="library" class="library-section"><div class="section-heading"><span id="library-count" class="count-label"></span></div><div class="library-controls"><div class="filter-row"><label><span>读者方向</span><select id="filter-audience"><option value="">全部受众</option><option>男频</option><option>女频</option><option>通用</option></select></label><label><span>金手指</span><select id="filter-golden-finger"><option value="">全部</option><option value="yes">有</option><option value="no">无</option></select></label><label><span>题材标签</span><select id="filter-topic"><option value="">全部题材</option></select></label><label><span>细化标签</span><select id="filter-tag"><option value="">全部细化标签</option></select></label><label class="search-field"><span>搜索</span><input id="library-search" type="search" placeholder="书名、作者或标签" autocomplete="off"></label><label><span>范围</span><select id="filter-scope"><option value="all">全部小说</option><option value="batch">最新批次</option></select></label><label><span>连载状态</span><select id="filter-status"><option value="">全部状态</option><option>连载中</option><option>已完结</option><option>状态待核</option></select></label></div><div class="sort-row"><label><span>排序字段</span><select id="sort-field"><option value="total">读者分 / 25</option><option value="platform">平台评分</option><option value="votes">评分人数</option><option value="readers">在读人数</option><option value="words">全文字数</option><option value="chapters">已采章节</option><option value="listed">已上架数</option><option value="selected">被挑选次数</option><option value="collected">采集时间</option></select></label><label><span>顺序</span><select id="sort-direction"><option value="desc">从高到低 ↓</option><option value="asc">从低到高 ↑</option></select></label><label class="more-columns"><input id="more-data" type="checkbox"><spa
